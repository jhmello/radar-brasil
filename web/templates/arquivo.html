{% extends "base.html" %}
{% block titulo %}Edições — Radar Brasil{% endblock %}
{% block conteudo %}
<h1 class="titulo-secao">Edições</h1>
{% if relatorios %}
<ul class="lista">
  {% for r in relatorios %}
  <li><a href="relatorios/{{ r.slug }}.html">{{ r.titulo }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p class="sub">Nenhuma edição ainda.</p>
{% endif %}
{% endblock %}
