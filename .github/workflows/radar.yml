name: Radar Brasil

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 em Brasília: coleta + atualiza o painel
    - cron: "47 9 * * 1"   # segunda, 06:47 em Brasília: coleta + boletim semanal
  workflow_dispatch:
    inputs:
      relatorio:
        description: "Gerar o boletim semanal agora"
        type: boolean
        default: false

permissions:
  contents: write
  models: read
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar dados
        run: python -m radar.collect

      - name: Gerar boletim semanal
        if: github.event.schedule == '47 9 * * 1' || inputs.relatorio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-4.1' }}
        run: python -m radar.analysis.relatorio

      - name: Salvar no repositório
        run: |
          mkdir -p data relatorios
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data relatorios
          git diff --staged --quiet || git commit -m "radar: $(date -u +%F)"
          git pull --rebase --autostash
          git push

      - name: Gerar site
        run: python -m web.build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
